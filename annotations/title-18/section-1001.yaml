- caseName: United States v. Gaudin
  citation: 515 U.S. 506
  court: SCOTUS
  date: '1995-06-19'
  holdingSummary: The materiality of a false statement under 18 U.S.C. § 1001 is an
    element of the offense that must be submitted to the jury and found beyond a reasonable
    doubt.
  retrievalExcerpt: The Constitution gives a criminal defendant the right to have
    a jury determine, beyond a reasonable doubt, his guilt of every element of the
    crime with which he is charged, including materiality under 18 U.S.C. § 1001.
