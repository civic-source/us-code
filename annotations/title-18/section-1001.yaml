- caseName: Brogan v. United States
  citation: 522 U.S. 398
  court: SCOTUS
  date: '1998-01-26'
  holdingSummary: There is no exception to 18 U.S.C. § 1001 criminal liability for
    a false statement that consists of a mere denial of wrongdoing ('exculpatory no').
  retrievalExcerpt: We Cannot Find Any Basis In The Text Of § 1001 For An 'Exculpatory
    No' Exception.
  reviewedProposition: 18 U.S.C. § 1001 covers any false statement of material fact
    within the jurisdiction of a federal agency or branch; the statute's plain text
    contains no exception for an 'exculpatory no' denial of guilt to federal investigators.
  supportingOpinionPassage: By its terms, 18 U.S.C. § 1001 covers 'any' false statement—that
    is, a false statement 'of whatever kind,' United States v. Gonzales, 520 U.S.
    1, 5 (1997). The word 'no' in response to a question assuredly makes a 'statement,'
    see, e.g., Webster's New International Dictionary 2461 (2d ed. 1950) ('that which
    is stated; an embodiment in words of facts or opinions').
  retrievalQuery: '"18 U.S.C. § 1001"'
