- caseName: United States v. Feola
  citation: 420 U.S. 671
  court: SCOTUS
  date: '1975-03-19'
  holdingSummary: 18 U.S.C. § 111 does not require proof that the assailant knew the
    victim was a federal officer; the federal-officer element is jurisdictional.
  retrievalExcerpt: We hold, therefore, that in order to incur criminal liability
    under § 111 an actor must entertain merely the criminal intent to do the acts
    therein specified.
  reviewedProposition: Conviction under 18 U.S.C. § 111 requires proof of intent to
    assault, resist, or impede, but does not require that the defendant knew the victim
    was a federal officer engaged in official duties.
  supportingOpinionPassage: We conclude, from all this, that in order to effectuate
    the congressional purpose of according maximum protection to federal officers
    by making prosecution for assaults upon them cognizable in the federal courts,
    § 111 cannot be construed as embodying an unexpressed requirement that an assailant
    be aware that his victim is a federal officer. All the statute requires is an
    intent to assault, not an intent to assault a federal officer.
